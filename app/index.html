<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aperio</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <header class="toolbar">
      <button id="open">Open…</button>
      <span id="title" class="muted">No photo open</span>
      <button id="export" disabled>Export…</button>
    </header>
    <main class="shell">
      <section class="canvas">
        <img id="preview" alt="" hidden />
        <p id="status" class="muted">Open a RAW, JPEG, PNG, or TIFF to start editing.</p>
      </section>
      <aside class="panel">
        <h2>Adjustments</h2>
        <form id="sliders"></form>
        <button id="reset" type="button" disabled>Reset</button>
      </aside>
    </main>
  </body>
</html>
