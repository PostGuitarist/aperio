[package]
name = "aperio-app"
description = "Aperio desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "aperio_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[features]
# ISNet as an optional "fast" subject model, offered as a separate download
# with a license notice (see LICENSES.md). Build with --no-default-features
# to leave it out.
default = ["fast-subject"]
fast-subject = ["aperio-plugin-segment/fast-subject"]

[dependencies]
aperio-ai.workspace = true
aperio-core.workspace = true
aperio-plugin.workspace = true
aperio-plugin-denoise.workspace = true
aperio-plugin-segment.workspace = true
aperio-plugin-sky.workspace = true
aperio-plugin-vignette.workspace = true
aperio-render.workspace = true
dirs = "6"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
