[package]
name = "aperio-app"
description = "Aperio desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "aperio_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
aperio-core.workspace = true
aperio-plugin.workspace = true
aperio-plugin-segment.workspace = true
aperio-plugin-vignette.workspace = true
aperio-render.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
