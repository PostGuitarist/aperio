<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Aperio redesign prototype</title>
<style>
:root {
  color-scheme: dark;
  --bg: #111215;
  --panel: #18191d;
  --panel-2: #1d1f24;
  --raised: #23262c;
  --hover: #2a2d34;
  --border: #282b31;
  --border-2: #33363e;
  --canvas: #0b0c0e;
  --text: #ebe8e2;
  --text-2: #c9c6c0;
  --muted: #8d909a;
  --faint: #5d606a;
  --accent: #f2b24c;
  --accent-dim: #f2b24c33;
  --accent-ink: #1a1306;
  --track: #2e3138;
  --mask: #e0524a;
  --ok: #6fc28b;
  font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: 12px;
}
* { box-sizing: border-box; }
body { margin: 0; width: 1440px; height: 900px; overflow: hidden; background: var(--bg); color: var(--text); display: grid; grid-template-rows: 44px 1fr 24px; }
.mono { font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
svg.i { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }
button { font: inherit; color: var(--text); background: var(--raised); border: 1px solid var(--border-2); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
button.ghost { background: none; border-color: transparent; color: var(--text-2); }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
kbd { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 10px; color: var(--muted); border: 1px solid var(--border-2); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: var(--panel-2); }

/* top bar */
.top { display: flex; align-items: center; gap: 10px; padding: 0 10px 0 14px; background: var(--panel); border-bottom: 1px solid var(--border); }
.logo { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 13px; letter-spacing: .01em; }
.logo .mark { width: 16px; height: 16px; border-radius: 50%; border: 3px solid var(--accent); position: relative; }
.logo .mark::after { content: ""; position: absolute; inset: 2px; border-radius: 50%; background: var(--accent); }
.modes { display: flex; background: var(--bg); border: 1px solid var(--border); border-radius: 7px; padding: 2px; margin-left: 8px; }
.modes button { border: 0; background: none; color: var(--muted); padding: 3px 12px; border-radius: 5px; }
.modes button.on { background: var(--raised); color: var(--text); }
.modes button kbd { margin-left: 6px; border: 0; background: none; padding: 0; color: var(--faint); }
.crumb { display: flex; align-items: center; gap: 8px; margin-left: 12px; color: var(--muted); }
.crumb b { color: var(--text); font-weight: 500; }
.crumb .pill { font-size: 10px; border: 1px solid var(--border-2); border-radius: 4px; padding: 0 5px; color: var(--muted); }
.spacer { flex: 1; }
.cmd { display: flex; align-items: center; gap: 8px; width: 260px; height: 28px; padding: 0 8px; border-radius: 7px; border: 1px solid var(--border); background: var(--bg); color: var(--faint); }
.cmd span { flex: 1; }
.tb-group { display: flex; gap: 2px; }
.tb-group button { padding: 4px 6px; }
.top .icon-btn { display: grid; place-items: center; width: 28px; height: 28px; padding: 0; background: none; border-color: transparent; color: var(--text-2); }
.top .icon-btn.on { background: var(--raised); color: var(--accent); border-color: var(--border-2); }

/* status bar */
.status { display: flex; align-items: center; gap: 16px; padding: 0 12px; background: var(--panel); border-top: 1px solid var(--border); color: var(--muted); font-size: 11px; }
.status .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); display: inline-block; margin-right: 6px; }
.status .keys { display: flex; gap: 12px; }

/* main layout */
.main { display: grid; grid-template-columns: 44px 224px minmax(0, 1fr) 324px; min-height: 0; }
.rail { background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; padding: 8px 0; gap: 2px; }
.rail button { width: 32px; height: 32px; display: grid; place-items: center; padding: 0; background: none; border-color: transparent; color: var(--text-2); position: relative; }
.rail button.on { background: var(--accent-dim); color: var(--accent); }
.rail button .k { position: absolute; right: 1px; bottom: 0; font-size: 8px; color: var(--faint); font-family: ui-monospace, monospace; }
.rail .sep { width: 20px; height: 1px; background: var(--border-2); margin: 5px 0; }

.left { background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.ptabs { display: flex; gap: 2px; padding: 8px 8px 0; border-bottom: 1px solid var(--border); }
.ptabs button { background: none; border: 0; border-bottom: 2px solid transparent; border-radius: 0; color: var(--muted); padding: 6px 8px; font-weight: 500; }
.ptabs button.on { color: var(--text); border-color: var(--accent); }
.search { margin: 8px; display: flex; align-items: center; gap: 6px; padding: 5px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--faint); }
.preset-group { padding: 4px 8px 6px; }
.preset-group h4 { display: flex; justify-content: space-between; margin: 6px 4px; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.presets { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.preset { border-radius: 6px; overflow: hidden; background: var(--panel-2); border: 1px solid var(--border); }
.preset.on { border-color: var(--accent); }
.preset .thumb { height: 52px; background-size: cover; background-position: center 40%; }
.preset .name { padding: 4px 6px; font-size: 11px; color: var(--text-2); display: flex; justify-content: space-between; }
.amount { margin: 4px 12px 8px; }
.history { border-top: 1px solid var(--border); margin-top: auto; padding: 8px; }
.history h4, .sec-title { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin: 2px 4px 6px; display: flex; justify-content: space-between; align-items: center; }
.hist-row { display: flex; justify-content: space-between; padding: 3px 6px; border-radius: 4px; color: var(--text-2); font-size: 11px; }
.hist-row.on { background: var(--raised); color: var(--text); }
.hist-row span:last-child { color: var(--faint); }
.snap { display: flex; gap: 6px; padding: 4px 4px 0; }
.snap div { flex: 1; height: 34px; border-radius: 4px; background-size: cover; background-position: center; border: 1px solid var(--border-2); position: relative; }
.snap div span { position: absolute; left: 3px; bottom: 1px; font-size: 9px; text-shadow: 0 1px 2px #000; }

/* center */
.center { display: grid; grid-template-columns: minmax(0, 1fr); overflow: hidden; grid-template-rows: 36px 1fr 96px; min-width: 0; min-height: 0; background: var(--canvas); }
.vbar { display: flex; align-items: center; gap: 6px; padding: 0 10px; border-bottom: 1px solid var(--border); background: #0f1013; }
.seg { display: flex; border: 1px solid var(--border-2); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; background: none; color: var(--muted); padding: 3px 9px; border-right: 1px solid var(--border-2); }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--raised); color: var(--text); }
.vbar .lbl { color: var(--faint); margin: 0 2px 0 8px; }
.clip { display: flex; gap: 4px; }
.clip span { width: 22px; height: 22px; display: grid; place-items: center; border-radius: 5px; border: 1px solid var(--border-2); }
.stage { position: relative; display: grid; place-items: center; overflow: hidden; }
.photo { position: relative; width: 800px; height: 450px; box-shadow: 0 10px 40px #000a; }
.photo canvas, .photo img { position: absolute; inset: 0; width: 100%; height: 100%; }
.split { position: absolute; top: 0; bottom: 0; width: 2px; background: #fff; left: 50%; box-shadow: 0 0 6px #0008; }
.split .knob { position: absolute; top: 50%; left: -13px; width: 28px; height: 28px; margin-top: -14px; border-radius: 50%; background: #fff; color: #111; display: grid; place-items: center; font-size: 11px; font-weight: 700; }
.tag { position: absolute; top: 10px; padding: 2px 8px; border-radius: 4px; background: #000a; font-size: 11px; backdrop-filter: blur(4px); }
.loupe-info { position: absolute; left: 12px; bottom: 10px; display: flex; gap: 14px; color: var(--muted); font-size: 11px; }
.navigator { position: absolute; right: 12px; bottom: 10px; width: 124px; border-radius: 6px; overflow: hidden; border: 1px solid var(--border-2); background: var(--panel); }
.navigator .img { height: 70px; background-size: cover; background-position: center; position: relative; }
.navigator .img i { position: absolute; left: 40%; top: 30%; width: 38%; height: 40%; border: 1.5px solid var(--accent); box-shadow: 0 0 0 999px #0007; }
.navigator .row { display: flex; justify-content: space-between; padding: 3px 7px; font-size: 10px; color: var(--muted); }

.strip { border-top: 1px solid var(--border); background: var(--panel); display: flex; flex-direction: column; }
.strip-head { display: flex; align-items: center; gap: 10px; padding: 4px 10px; font-size: 11px; color: var(--muted); }
.thumbs { display: flex; gap: 6px; padding: 0 10px; overflow: hidden; }
.th { width: 104px; height: 62px; border-radius: 4px; flex: none; position: relative; background-size: cover; background-position: center; border: 2px solid transparent; }
.th.on { border-color: var(--accent); }
.th .stars { position: absolute; left: 4px; bottom: 2px; font-size: 9px; color: #fff; text-shadow: 0 1px 2px #000; letter-spacing: 1px; }
.th .lab { position: absolute; right: 4px; top: 4px; width: 8px; height: 8px; border-radius: 2px; }
.th .ed { position: absolute; right: 4px; bottom: 4px; width: 12px; height: 12px; border-radius: 3px; background: #000a; display: grid; place-items: center; }
.th .ed::after { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
.th.rej { opacity: .35; }

/* right panel */
.right { min-width: 0; background: var(--panel); border-left: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.histo { padding: 10px 10px 6px; border-bottom: 1px solid var(--border); }
.histo .box { position: relative; height: 92px; border-radius: 6px; background: #0c0d10; overflow: hidden; border: 1px solid var(--border); }
.histo canvas { width: 100%; height: 100%; display: block; }
.histo .tri { position: absolute; top: 4px; width: 0; height: 0; border: 5px solid transparent; }
.histo .tri.l { left: 4px; border-top-color: #4aa3ff; border-left-color: #4aa3ff; }
.histo .tri.r { right: 4px; border-top-color: var(--mask); border-right-color: var(--mask); }
.exif { display: flex; justify-content: space-between; padding: 6px 2px 0; color: var(--muted); font-size: 11px; }
.rtabs { display: flex; padding: 0 6px; border-bottom: 1px solid var(--border); }
.rtabs button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; background: none; border: 0; border-bottom: 2px solid transparent; border-radius: 0; color: var(--muted); padding: 7px 0 6px; font-size: 10px; }
.rtabs button.on { color: var(--text); border-color: var(--accent); }
.rtabs button.on svg { color: var(--accent); }
.scroll { flex: 1; overflow: hidden; }
.layerbar { padding: 8px 10px; border-bottom: 1px solid var(--border); }
.layer-row { display: flex; align-items: center; gap: 8px; padding: 5px 6px; border-radius: 6px; }
.layer-row.on { background: var(--raised); box-shadow: inset 2px 0 0 var(--accent); }
.layer-row .eye { color: var(--muted); }
.layer-row .lt { width: 30px; height: 20px; border-radius: 3px; background-size: cover; background-position: center; border: 1px solid var(--border-2); }
.layer-row .mt { width: 30px; height: 20px; border-radius: 3px; border: 1px solid var(--border-2); }
.layer-row .nm { flex: 1; }
.layer-row .op { color: var(--faint); font-size: 11px; }
.blend { display: flex; gap: 6px; margin-top: 6px; }
.select { flex: 1; display: flex; align-items: center; justify-content: space-between; height: 24px; padding: 0 8px; border-radius: 5px; border: 1px solid var(--border-2); background: var(--bg); color: var(--text-2); }
.section { border-bottom: 1px solid var(--border); }
.sh { display: flex; align-items: center; gap: 8px; padding: 8px 12px; font-weight: 600; font-size: 12px; }
.sh .chev { color: var(--muted); width: 12px; }
.sh .acts { margin-left: auto; display: flex; gap: 8px; color: var(--faint); }
.sh .dotmod { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.sb { padding: 0 12px 10px; }
.sub { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); margin: 6px 0 2px; font-weight: 600; }
.sl { display: grid; grid-template-columns: 84px 1fr 62px; align-items: center; gap: 8px; height: 22px; }
.sl label { color: var(--text-2); white-space: nowrap; }
.sl.mod label { color: var(--text); }
.sl .val { white-space: nowrap; text-align: right; font-size: 11px; color: var(--muted); padding: 1px 4px; border-radius: 3px; }
.sl.mod .val { color: var(--text); }
.trk { position: relative; height: 3px; border-radius: 2px; background: var(--track); }
.trk .fill { position: absolute; top: 0; bottom: 0; background: var(--accent); border-radius: 2px; }
.trk .zero { position: absolute; left: 50%; top: -3px; width: 1px; height: 9px; background: var(--border-2); }
.trk .th2 { position: absolute; top: 50%; width: 11px; height: 11px; margin: -5.5px 0 0 -5.5px; border-radius: 50%; background: #e9e6e0; box-shadow: 0 1px 3px #000a; }
.trk.grad { height: 4px; }
.wb-row { display: flex; gap: 6px; margin: 2px 0 6px; }
.wb-row .select { flex: 1; }
.wb-row button { padding: 2px 6px; display: grid; place-items: center; }
.auto { display: flex; gap: 6px; }
.auto button { padding: 1px 8px; font-size: 11px; }

/* curve */
.curve-head { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
.chans { display: flex; gap: 4px; }
.chans span { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--border-2); font-size: 9px; }
.chans span.on { border-color: var(--text); }
.curvebox { height: 150px; border-radius: 6px; background: #0c0d10; border: 1px solid var(--border); position: relative; overflow: hidden; }
.curvebox svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.regions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-top: 6px; }

/* HSL / mixer */
.mix-tabs { display: flex; gap: 0; margin-bottom: 6px; }
.colors { display: flex; justify-content: space-between; margin: 4px 0 8px; }
.colors span { width: 22px; height: 22px; border-radius: 50%; border: 2px solid transparent; }
.colors span.on { border-color: #fff; box-shadow: 0 0 0 2px var(--panel), 0 0 0 3px #fff4; }
.wheels { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.wheel { text-align: center; }
.wheel .w { width: 76px; height: 76px; margin: 0 auto; border-radius: 50%; position: relative;
  background: radial-gradient(circle, #ddd 0%, #ddd0 70%), conic-gradient(from 90deg, #f55, #fb4, #ef5, #5e6, #5ef, #56f, #e5f, #f55); }
.wheel .w::after { content: ""; position: absolute; inset: 0; border-radius: 50%; box-shadow: inset 0 0 0 1px #0006; background: radial-gradient(circle, #18191d00 0%, #18191d55 100%); }
.wheel .p { position: absolute; width: 10px; height: 10px; border-radius: 50%; border: 2px solid #fff; z-index: 1; box-shadow: 0 0 3px #000; }
.wheel .lum { height: 3px; margin: 8px 6px 4px; border-radius: 2px; background: linear-gradient(90deg, #000, #fff); position: relative; }
.wheel .lum i { position: absolute; top: -4px; width: 10px; height: 10px; border-radius: 50%; background: #e9e6e0; margin-left: -5px; }
.wheel .t { font-size: 11px; color: var(--text-2); }
.wheel .v { font-size: 10px; color: var(--muted); }
.global-wheel { display: flex; gap: 12px; align-items: center; margin-top: 10px; }

/* mask panel */
.mask-list { padding: 6px 10px; }
.mask-item { border: 1px solid var(--border-2); border-radius: 8px; padding: 8px; background: var(--panel-2); margin-bottom: 8px; }
.mask-item.on { border-color: var(--accent); }
.mask-item .hd { display: flex; align-items: center; gap: 8px; }
.mask-item .comp { margin: 8px 0 0 10px; border-left: 1px solid var(--border-2); padding-left: 10px; display: flex; flex-direction: column; gap: 6px; }
.comp-row { display: flex; align-items: center; gap: 8px; color: var(--text-2); }
.comp-row .op { width: 18px; height: 18px; border-radius: 4px; display: grid; place-items: center; background: var(--raised); font-size: 12px; color: var(--muted); }
.comp-row .mtn { width: 34px; height: 20px; border-radius: 3px; border: 1px solid var(--border-2); }
.ai-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
.ai-grid button { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 4px; font-size: 11px; }
.ai-grid button.ready::after { content: "Ready"; font-size: 9px; color: var(--ok); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { padding: 3px 8px; border-radius: 999px; border: 1px solid var(--border-2); color: var(--text-2); font-size: 11px; display: flex; align-items: center; gap: 4px; }
.chip.on { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
.mask-hud { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; align-items: center; padding: 5px 10px; border-radius: 8px; background: #121316e6; border: 1px solid var(--border-2); font-size: 11px; }
.mask-hud .sw { width: 12px; height: 12px; border-radius: 3px; background: var(--mask); }

/* library */
.lib { display: grid; grid-template-columns: 220px minmax(0, 1fr) 300px; min-height: 0; }
.lib .left { padding: 8px; }
.nav-row { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 5px; color: var(--text-2); }
.nav-row.on { background: var(--raised); color: var(--text); }
.nav-row .n { margin-left: auto; color: var(--faint); font-size: 11px; }
.grid-wrap { display: grid; grid-template-rows: 40px 1fr; background: var(--canvas); min-height: 0; }
.filterbar { display: flex; align-items: center; gap: 8px; padding: 0 12px; border-bottom: 1px solid var(--border); background: #0f1013; }
.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 12px; align-content: start; }
.cell { border-radius: 6px; background: var(--panel); border: 1px solid var(--border); overflow: hidden; }
.cell.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.cell.sel { border-color: #f2b24c88; }
.cell .im { height: 132px; background-size: cover; background-position: center; position: relative; }
.cell .meta { display: flex; align-items: center; gap: 6px; padding: 5px 8px; font-size: 11px; color: var(--muted); }
.cell .meta .st { color: var(--accent); letter-spacing: 1px; }
.cell .meta .st i { color: var(--faint); font-style: normal; }
.cell .badge { position: absolute; left: 6px; top: 6px; font-size: 9px; padding: 1px 5px; border-radius: 3px; background: #000a; }
.cell .flag { position: absolute; right: 6px; top: 6px; width: 18px; height: 18px; display: grid; place-items: center; border-radius: 4px; background: #000a; }
.cell .lb { width: 8px; height: 8px; border-radius: 2px; margin-left: auto; }
.batch button { white-space: nowrap; }
.batch { white-space: nowrap; position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; gap: 6px; align-items: center; padding: 6px 8px 6px 14px; border-radius: 10px; background: #1d1f24f2; border: 1px solid var(--border-2); box-shadow: 0 10px 30px #000a; }
.info-row { display: grid; grid-template-columns: 82px 1fr; padding: 3px 0; font-size: 11px; }
.info-row span:first-child { color: var(--muted); }
.kw { display: flex; flex-wrap: wrap; gap: 4px; }

/* palette */
.overlay-dim { position: fixed; inset: 0; background: #0009; display: grid; place-items: start center; padding-top: 110px; }
.palette { width: 600px; border-radius: 12px; background: var(--panel); border: 1px solid var(--border-2); box-shadow: 0 30px 80px #000; overflow: hidden; }
.palette .in { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--border); font-size: 15px; }
.palette .in .cur { width: 1.5px; height: 18px; background: var(--accent); margin-left: -8px; }
.prow { display: flex; align-items: center; gap: 10px; padding: 8px 16px; color: var(--text-2); }
.prow.on { background: var(--raised); color: var(--text); box-shadow: inset 2px 0 0 var(--accent); }
.prow .sp { flex: 1; }
.prow .cat { color: var(--faint); font-size: 11px; }
.pgroup { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); padding: 10px 16px 4px; font-weight: 600; }
.pfoot { display: flex; gap: 14px; padding: 8px 16px; border-top: 1px solid var(--border); color: var(--muted); font-size: 11px; }
.cheat { position: fixed; right: 344px; bottom: 140px; width: 300px; padding: 10px 12px; border-radius: 10px; background: var(--panel); border: 1px solid var(--border-2); box-shadow: 0 20px 50px #000c; }
.cheat .r { display: flex; justify-content: space-between; padding: 3px 0; color: var(--text-2); }
</style>
</head>
<body>
<header class="top" id="top"></header>
<div id="main"></div>
<footer class="status" id="status"></footer>
<script>
const view = new URLSearchParams(location.search).get("view") || "develop";
const P = "img/"; // put the photos from README.md here
const PHOTOS = ["mekong_storm", "neskaupstadur", "laugavegur", "nam_khan_rainbow", "vialais_creek", "san_carlos", "luang_prabang_bridge", "moraine_lake"];
const MAIN = P + "mekong_storm.jpg";

function sl(label, v, min, max, fmt, opts = {}) {
  const pct = ((v - min) / (max - min)) * 100;
  const zero = opts.zero ?? ((0 - min) / (max - min)) * 100;
  const mod = Math.abs(v - (opts.neutral ?? 0)) > 1e-6;
  const fill = opts.grad ? "" : `<div class="fill" style="left:${Math.min(pct, zero)}%;width:${Math.abs(pct - zero)}%"></div>`;
  return `<div class="sl ${mod ? "mod" : ""}"><label>${label}</label><div class="trk ${opts.grad ? "grad" : ""}" style="${opts.grad ? `background:${opts.grad}` : ""}">${opts.grad ? "" : '<div class="zero"></div>'}${fill}<div class="th2" style="left:${pct}%"></div></div><span class="val mono">${fmt(v)}</span></div>`;
}
const sg = (d) => (v) => (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v).toFixed(d);
const int = (v) => (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(Math.round(v));

function section(title, body, { open = true, mod = false, acts = true } = {}) {
  return `<div class="section"><div class="sh"><span class="chev">${ic(open ? "chevD" : "chevR", 12)}</span>${title}${mod ? '<span class="dotmod" title="Changed"></span>' : ""}${acts ? `<span class="acts">${ic("eye", 14)}${ic("reset", 14)}</span>` : ""}</div>${open ? `<div class="sb">${body}</div>` : ""}</div>`;
}

// Real histogram + sky mask from the photo pixels.
const img = new Image();
img.src = MAIN;
img.onload = () => {
  const c = document.createElement("canvas");
  c.width = 480; c.height = 270;
  const x = c.getContext("2d");
  x.filter = EDIT_FILTER;
  x.drawImage(img, 0, 0, c.width, c.height);
  const d = x.getImageData(0, 0, c.width, c.height).data;
  const H = [new Float32Array(256), new Float32Array(256), new Float32Array(256), new Float32Array(256)];
  for (let i = 0; i < d.length; i += 4) { H[0][d[i]]++; H[1][d[i + 1]]++; H[2][d[i + 2]]++; H[3][Math.round(0.2126 * d[i] + 0.7152 * d[i + 1] + 0.0722 * d[i + 2])]++; }
  const smooth = (h) => h.map((_, i) => { let s = 0, n = 0; for (let k = -3; k <= 3; k++) if (h[i + k] !== undefined) { s += h[i + k]; n++; } return s / n; });
  const Hs = H.map(smooth);
  const draw = (cv, alpha = 1) => {
    if (!cv) return;
    const g = cv.getContext("2d"); const W = cv.width, Ht = cv.height;
    const max = Math.max(...Hs.slice(0, 3).flatMap((h) => Array.from(h.slice(4, 252))));
    g.clearRect(0, 0, W, Ht);
    g.strokeStyle = "#ffffff10"; g.lineWidth = 1;
    for (let k = 1; k < 4; k++) { g.beginPath(); g.moveTo((W * k) / 4, 0); g.lineTo((W * k) / 4, Ht); g.stroke(); }
    g.globalCompositeOperation = "screen";
    [["#e5534b", 0], ["#5cc46a", 1], ["#4a8cff", 2]].forEach(([col, ch]) => {
      g.fillStyle = col; g.globalAlpha = 0.55 * alpha; g.beginPath(); g.moveTo(0, Ht);
      for (let i = 0; i < 256; i++) g.lineTo((i / 255) * W, Ht - Math.min(1, Hs[ch][i] / max) * Ht * 0.92);
      g.lineTo(W, Ht); g.fill();
    });
    g.globalCompositeOperation = "source-over"; g.globalAlpha = 0.9 * alpha; g.strokeStyle = "#ebe8e2"; g.lineWidth = 1.5; g.beginPath();
    for (let i = 0; i < 256; i++) g.lineTo((i / 255) * W, Ht - Math.min(1, Hs[3][i] / max) * Ht * 0.92);
    g.stroke(); g.globalAlpha = 1;
  };
  document.querySelectorAll("#hist").forEach((cv) => draw(cv));
  draw(document.getElementById("chist"), 0.8);

  const mc = document.getElementById("maskc");
  if (mc) {
    const W = mc.width, Ht = mc.height;
    const s = document.createElement("canvas"); s.width = W; s.height = Ht;
    const sx = s.getContext("2d"); sx.drawImage(img, 0, 0, W, Ht);
    const src = sx.getImageData(0, 0, W, Ht).data;
    const out = mc.getContext("2d").createImageData(W, Ht);
    // Crude stand-in for the AI sky mask: bluish/grey and above the treeline.
    const horizon = new Float32Array(W);
    for (let xx = 0; xx < W; xx++) {
      let yy = 0;
      for (; yy < Ht; yy++) { const k = (yy * W + xx) * 4; const r = src[k], g = src[k + 1], b = src[k + 2]; if (yy > Ht * 0.3 && ((g > b + 6 && g > r - 4) || (0.3*r+0.6*g+0.1*b < 95 && yy > Ht * 0.52))) break; }
      horizon[xx] = yy;
    }
    for (let xx = 0; xx < W; xx++) { let s2 = 0, n = 0; for (let k = -6; k <= 6; k++) { const v = horizon[xx + k]; if (v !== undefined) { s2 += v; n++; } } horizon[xx] = Math.min(s2 / n, Ht * 0.66); }
    for (let yy = 0; yy < Ht; yy++) for (let xx = 0; xx < W; xx++) {
      const k = (yy * W + xx) * 4; const m = Math.max(0, Math.min(1, (horizon[xx] - yy) / 6));
      out.data[k] = 224; out.data[k + 1] = 82; out.data[k + 2] = 74; out.data[k + 3] = m * 140;
    }
    mc.getContext("2d").putImageData(out, 0, 0);
  }
};
