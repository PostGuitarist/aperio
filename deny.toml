# License and advisory policy, checked in CI with `cargo deny check`.
# Every allowed license must be compatible with GPL-3.0-or-later.

[graph]
all-features = true

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "GPL-3.0-or-later",
    "ISC",
    "LGPL-2.1-or-later",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9
# Some entries are pre-approved for libraries we expect to add (RAW, ONNX, wgpu).
unused-allowed-license = "allow"

[[licenses.clarify]]
crate = "aperio-core"
expression = "GPL-3.0-or-later"
license-files = []

[[licenses.clarify]]
crate = "aperio-app"
expression = "GPL-3.0-or-later"
license-files = []

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
