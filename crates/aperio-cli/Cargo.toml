[package]
name = "aperio-cli"
description = "Command-line renderer for Aperio edits"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "aperio"
path = "src/main.rs"

[features]
# ISNet as an optional "fast" subject model, offered as a separate download
# with a license notice (see LICENSES.md). Build with --no-default-features
# to leave it out.
default = ["fast-subject"]
fast-subject = ["aperio-plugin-segment/fast-subject"]

[dependencies]
aperio-ai.workspace = true
aperio-core.workspace = true
aperio-plugin.workspace = true
aperio-plugin-denoise.workspace = true
aperio-plugin-segment.workspace = true
aperio-plugin-sky.workspace = true
aperio-plugin-vignette.workspace = true
aperio-render.workspace = true
serde_json.workspace = true

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff"] }
