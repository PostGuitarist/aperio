[package]
name = "aperio-cli"
description = "Command-line renderer for Aperio edits"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "aperio"
path = "src/main.rs"

[features]
# ISNet as an optional "fast" subject model; off by default (see LICENSES.md).
fast-subject = ["aperio-plugin-segment/fast-subject"]

[dependencies]
aperio-core.workspace = true
aperio-plugin.workspace = true
aperio-plugin-segment.workspace = true
aperio-plugin-sky.workspace = true
aperio-plugin-vignette.workspace = true
aperio-render.workspace = true
serde_json.workspace = true
