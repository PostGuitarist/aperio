[package]
name = "aperio-plugin-segment"
description = "AI sky and subject masks for Aperio, using open ONNX models"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[features]
# ISNet as a "fast" subject model (an optional download). Off until its
# license questions are settled; see LICENSES.md.
fast-subject = []

[dependencies]
aperio-plugin.workspace = true
dirs = "6"
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "download-binaries", "copy-dylibs", "tls-rustls"] }
serde_json.workspace = true
sha2 = "0.10"
ureq = "3"

[dev-dependencies]
aperio-render.workspace = true

# GPU acceleration: each platform gets the ONNX Runtime build with its GPU
# execution provider (the prebuilt binaries ort downloads come per target).
[target.'cfg(windows)'.dependencies]
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["directml"] }

[target.'cfg(target_os = "macos")'.dependencies]
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["coreml"] }

