name: CI

# Pull requests and main run on Linux only. The repo is private, where macOS
# minutes cost 10x and Windows 2x, so those builds run only for release tags
# or when started by hand from the Actions tab. A release tag (v*) also builds
# the installers and attaches them to a draft GitHub release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources

  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && fromJSON('["ubuntu-24.04","macos-latest","windows-latest"]') || fromJSON('["ubuntu-24.04"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev libayatana-appindicator3-dev mesa-vulkan-drivers libheif1 libheif-plugin-libde265

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Build frontend
        working-directory: app
        run: |
          npm ci
          npm run build

      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The segment plugin on its own builds without fast-subject.
      - run: cargo clippy -p aperio-plugin-segment --all-targets -- -D warnings
      - run: cargo test --workspace
        env:
          # Linux runners have no GPU; Mesa's software Vulkan driver stands in.
          APERIO_REQUIRE_GPU: ${{ runner.os == 'Linux' && '1' || '' }}

      # Windows and macOS builds run the AI models once, to check that the GPU
      # provider (DirectML, Core ML) loads or falls back to the CPU cleanly.
      # Runners have no usable GPU, so the timings say nothing about speed.
      - name: AI models smoke test
        if: runner.os != 'Linux'
        run: |
          cargo run --release -p aperio-cli -- models download
          cargo run --release -p aperio-cli -- models bench

      # Release tags only. The smoke test above has already built the release
      # profile, which put DirectML.dll in target/release on Windows; the
      # Windows installer ships that copy (see LICENSES.md).
      - name: Build installers
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: app
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            npm run tauri build -- --config src-tauri/release-windows.conf.json
          else
            npm run tauri build
          fi

      - name: Upload installers
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          if-no-files-found: error
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage

  # Collects every platform's installers into one draft release, once all
  # three builds have passed. Publishing the draft is left to a person.
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [lint, licenses, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l installers
          gh release create "$GITHUB_REF_NAME" installers/* \
            --draft --prerelease \
            --title "Aperio $GITHUB_REF_NAME" \
            --notes-file docs/release-notes.md
