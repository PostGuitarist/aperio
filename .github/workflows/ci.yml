name: CI

# Pull requests and main run on Linux only. The repo is private, where macOS
# minutes cost 10x and Windows 2x, so those builds run only for release tags
# or when started by hand from the Actions tab. Release builds are in
# release.yml.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources

  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'workflow_dispatch' && fromJSON('["ubuntu-24.04","macos-latest","windows-latest"]') || fromJSON('["ubuntu-24.04"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # The debug and release targets, the sky model, and the cache archives
      # don't fit in the runner's free space, so drop preinstalled SDKs that
      # Aperio doesn't use.
      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev libayatana-appindicator3-dev mesa-vulkan-drivers libheif1 libheif-plugin-libde265

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Build frontend
        working-directory: app
        run: |
          npm ci
          npm run build

      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The segment plugin on its own builds without fast-subject.
      - run: cargo clippy -p aperio-plugin-segment --all-targets -- -D warnings
      # The end-to-end test (crates/aperio-cli/tests/end_to_end.rs) needs the
      # sky model on Linux. It's cached, so it's downloaded only when the
      # pinned models change.
      - name: Cache the sky model
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ~/.local/share/aperio/models
          key: aperio-sky-model-${{ hashFiles('plugins/segment/src/models.rs') }}
      - name: Download the sky model
        if: runner.os == 'Linux'
        run: cargo run -q -p aperio-cli -- models download skyseg

      - run: cargo test --workspace
        env:
          # Linux runners have no GPU; Mesa's software Vulkan driver stands in.
          APERIO_REQUIRE_GPU: ${{ runner.os == 'Linux' && '1' || '' }}
          APERIO_REQUIRE_MODELS: ${{ runner.os == 'Linux' && '1' || '' }}

      # Windows and macOS builds run the AI models once, to check that the GPU
      # provider (DirectML, Core ML) loads or falls back to the CPU cleanly.
      # Runners have no usable GPU, so the timings say nothing about speed.
      - name: AI models smoke test
        if: runner.os != 'Linux'
        run: |
          cargo run --release -p aperio-cli -- models download
          cargo run --release -p aperio-cli -- models bench
