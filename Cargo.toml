[workspace]
resolver = "2"
members = [
    "crates/aperio-ai",
    "crates/aperio-core",
    "crates/aperio-plugin",
    "crates/aperio-render",
    "crates/aperio-cli",
    "plugins/denoise",
    "plugins/segment",
    "plugins/sky",
    "plugins/vignette",
    "app/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/PostGuitarist/aperio"
rust-version = "1.90"

[workspace.dependencies]
aperio-ai = { path = "crates/aperio-ai" }
aperio-core = { path = "crates/aperio-core" }
aperio-plugin = { path = "crates/aperio-plugin" }
aperio-plugin-denoise = { path = "plugins/denoise" }
aperio-plugin-segment = { path = "plugins/segment" }
aperio-plugin-sky = { path = "plugins/sky" }
aperio-plugin-vignette = { path = "plugins/vignette" }
aperio-render = { path = "crates/aperio-render" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# `npm run tauri dev` and `cargo test` use the dev profile, which doesn't
# optimize by default: per-pixel work then runs 10 to 50 times slower and the
# editor feels broken. Optimize the dependencies and the crates that touch
# pixels even there; the rest stays quick to rebuild and easy to debug.
[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.aperio-render]
opt-level = 3

[profile.dev.package.aperio-plugin-denoise]
opt-level = 3

[profile.dev.package.aperio-plugin-segment]
opt-level = 3

[profile.dev.package.aperio-plugin-sky]
opt-level = 3

[profile.dev.package.aperio-plugin-vignette]
opt-level = 3
